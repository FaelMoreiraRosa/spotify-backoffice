networks:
  spotify-network:
    external: true # Conecta à rede existente onde o Postgres está rodando

services:
  spotify-backoffice:
    container_name: spotify-backoffice
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: spotify-backoffice:latest
    command: sh -c "npm install && npm run dev"
    env_file:
      - .env # Passa as variáveis do .env (como a DATABASE_URL) para o container
    networks:
      - spotify-network
    ports:
      - "3001:3000"
    volumes:
      - .:/app
      - /app/node_modules